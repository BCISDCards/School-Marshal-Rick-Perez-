<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b10">

<title>Rick Perez | Mega Marshalon</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(#0b4528, #020906);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.wrap {
  width: min(92%, 520px);
  text-align: center;
}

.card {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 24px;
  box-shadow: 0 18px 40px rgba(0,0,0,.55);
}

.controls {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 25px;
  flex-wrap: wrap;
}

button,
a.btn {
  border: 3px solid #d7ad32;
  background: #0b4d2b;
  color: #ffd95a;
  padding: 14px 24px;
  border-radius: 40px;
  font-size: 18px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

.hint {
  margin-top: 18px;
  color: #ccc;
  font-size: 16px;
  line-height: 1.4;
}
</style>
</head>

<body>

<main class="wrap">

<img
  id="card"
  class="card"
  src="front.png"
  alt="Rick Perez School Marshal trading card"
>

<div class="controls">

<button id="flip">
Show Mega Marshalon
</button>

<a
  id="save"
  class="btn"
  href="front.png"
  download="Rick-Perez-Card.png"
>
Save Card
</a>

</div>

<div class="hint">
Tap the button to switch between the Rick Perez card and Mega Marshalon.
</div>

</main>

<script>

const card = document.getElementById("card");
const flip = document.getElementById("flip");
const save = document.getElementById("save");

let showingBack = false;

flip.onclick = () => {

  showingBack = !showingBack;

  if (showingBack) {

    card.src = "back.png";
    card.alt = "Mega Marshalon character trading card";

    flip.textContent = "Show Rick Perez";

    save.href = "back.png";
    save.download = "Mega-Marshalon-Card.png";

  } else {

    card.src = "front.png";
    card.alt = "Rick Perez School Marshal trading card";

    flip.textContent = "Show Mega Marshalon";

    save.href = "front.png";
    save.download = "Rick-Perez-Card.png";
  }
};

</script>

</body>
</html>
