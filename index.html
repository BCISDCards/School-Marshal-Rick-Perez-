<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Marshal Bettis — Year One</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07131c;color:white;font-family:Arial,sans-serif}
.wrap{text-align:center;padding:24px}
h1{font-size:1.25rem;margin:0 0 18px}
.card{width:min(88vw,430px);aspect-ratio:0.714;perspective:1200px;margin:auto;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;overflow:hidden;box-shadow:0 15px 45px #0008}
.face.back{transform:rotateY(180deg)}
.face img{width:100%;height:100%;object-fit:contain;background:#000;display:block}
p{opacity:.8;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
<h1>School Marshal Bettis — Year One</h1>
<div class="card" id="card" aria-label="Tap to flip card">
  <div class="inner">
    <div class="face"><img src="year-one-school-marshal-bettis-front.jpg" alt="Year One School Marshal Bettis front"></div>
    <div class="face back"><img src="year-one-school-marshal-bettis-back.jpg" alt="Year One School Marshal Bettis back"></div>
  </div>
</div>
<p>Tap the card to flip it.</p>
</div>
<script>
document.getElementById('card').addEventListener('click',e=>e.currentTarget.classList.toggle('flipped'));
</script>
</body>
</html>
