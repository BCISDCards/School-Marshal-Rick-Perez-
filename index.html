<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rick Perez • Holographic Marshal Card</title>
<style>
:root{--mx:50%;--my:50%;--rx:0deg;--ry:0deg}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#080b10;color:white;font-family:system-ui,-apple-system,sans-serif}
.wrap{width:100%;text-align:center;padding:20px}
.scene{width:min(88vw,520px);aspect-ratio:7/9;margin:auto;perspective:1200px;touch-action:none}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.8,.2,1)}
.card.flipped{transform:rotateX(var(--rx)) rotateY(calc(180deg + var(--ry)))}
.card:not(.flipped){transform:rotateX(var(--rx)) rotateY(var(--ry))}
.face{position:absolute;inset:0;border-radius:24px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 20px 60px #000a}
.face.back{transform:rotateY(180deg)}
.face img{width:100%;height:100%;display:block;object-fit:contain;background:#111}
.foil,.glare,.sparkle{position:absolute;inset:0;pointer-events:none}
.foil{opacity:.38;mix-blend-mode:color-dodge;background:linear-gradient(115deg,transparent 20%,rgba(0,255,255,.35) 38%,rgba(255,0,255,.35) 50%,rgba(255,255,0,.3) 62%,transparent 80%);background-position:var(--mx) var(--my)}
.glare{opacity:.68;mix-blend-mode:screen;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.7),transparent 35%)}
.sparkle{opacity:.20;mix-blend-mode:screen;background-image:radial-gradient(circle,white 1px,transparent 1.5px);background-size:17px 17px}
.hint{margin-top:16px;font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.75}
.badge{display:inline-block;margin-top:8px;padding:6px 10px;border:1px solid #ffffff33;border-radius:999px;font-size:12px;opacity:.75}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="face front">
        <img src="front.png" alt="Rick Perez School Marshal Card">
        <i class="foil"></i><i class="glare"></i><i class="sparkle"></i>
      </div>
      <div class="face back">
        <img src="back-mega-marshall.png" alt="Mega Marshall Card">
        <i class="foil"></i><i class="glare"></i><i class="sparkle"></i>
      </div>
    </div>
  </div>
  <div class="hint">Drag to tilt • Tap to flip</div>
  <div class="badge">Bishop CISD • Digital Collectible</div>
</div>
<script>
const scene=document.getElementById('scene'),card=document.getElementById('card'),root=document.documentElement;
let moved=false,sx=0,sy=0;
function tilt(x,y){
 const r=scene.getBoundingClientRect();
 const px=Math.max(0,Math.min(1,(x-r.left)/r.width));
 const py=Math.max(0,Math.min(1,(y-r.top)/r.height));
 root.style.setProperty('--mx',(px*100)+'%');
 root.style.setProperty('--my',(py*100)+'%');
 root.style.setProperty('--rx',((.5-py)*24)+'deg');
 root.style.setProperty('--ry',((px-.5)*24)+'deg');
}
function reset(){root.style.setProperty('--rx','0deg');root.style.setProperty('--ry','0deg')}
scene.addEventListener('pointerdown',e=>{moved=false;sx=e.clientX;sy=e.clientY;scene.setPointerCapture?.(e.pointerId)});
scene.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){if(Math.hypot(e.clientX-sx,e.clientY-sy)>7)moved=true;tilt(e.clientX,e.clientY)}});
scene.addEventListener('pointerup',()=>{if(!moved)card.classList.toggle('flipped');reset()});
scene.addEventListener('pointercancel',reset);
scene.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')reset()});
</script>
</body>
</html>
