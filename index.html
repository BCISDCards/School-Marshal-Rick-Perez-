<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rick Perez • Holographic Marshal Card</title>
<style>
:root{--mx:50%;--my:50%;--rx:0deg;--ry:0deg}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#07110b}
body{
  min-height:100svh;display:grid;place-items:center;color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}
.wrap{width:100%;text-align:center;padding:20px}
.scene{
  width:min(88vw,520px);
  aspect-ratio:7/9;
  margin:auto;
  perspective:1400px;
  -webkit-perspective:1400px;
  touch-action:none;
}
.card{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;
  transition:transform .58s cubic-bezier(.2,.75,.2,1);
  transform:rotateX(var(--rx)) rotateY(var(--ry));
  will-change:transform;
}
.card.flipped{
  transform:rotateX(var(--rx)) rotateY(calc(180deg + var(--ry)));
}
.face{
  position:absolute;inset:0;
  overflow:hidden;border-radius:24px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;
  box-shadow:0 20px 60px rgba(0,0,0,.65);
}
.front{
  transform:rotateY(0deg) translateZ(1px);
  -webkit-transform:rotateY(0deg) translateZ(1px);
}
.back{
  transform:rotateY(180deg) translateZ(1px);
  -webkit-transform:rotateY(180deg) translateZ(1px);
}
.face img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;display:block;background:#080b08;
  -webkit-user-select:none;user-select:none;
  pointer-events:none;
}
.foil,.glare,.sparkle{
  position:absolute;inset:0;pointer-events:none;
  border-radius:inherit;
}
.foil{
  opacity:.34;mix-blend-mode:color-dodge;
  background:
    linear-gradient(115deg,
      transparent 16%,
      rgba(0,255,190,.22) 34%,
      rgba(255,215,0,.30) 45%,
      rgba(100,150,255,.24) 55%,
      rgba(255,255,255,.22) 64%,
      transparent 82%);
  background-position:var(--mx) var(--my);
}
.glare{
  opacity:.55;mix-blend-mode:screen;
  background:radial-gradient(circle at var(--mx) var(--my),
    rgba(255,255,255,.72),rgba(255,255,255,.12) 18%,transparent 38%);
}
.sparkle{
  opacity:.15;mix-blend-mode:screen;
  background-image:radial-gradient(circle,rgba(255,255,255,.95) 1px,transparent 1.6px);
  background-size:18px 18px;
}
.hint{
  margin-top:16px;font-size:12px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;opacity:.82
}
.badge{
  display:inline-block;margin-top:10px;padding:7px 13px;
  border:1px solid rgba(255,215,0,.45);border-radius:999px;
  font-size:12px;color:#f5d96b
}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="scene" id="scene" aria-label="Interactive Rick Perez School Marshal collectible card">
    <div class="card" id="card">
      <div class="face front">
        <img src="./front.png?v=3" alt="Rick Perez School Marshal Supervisor card">
        <i class="foil"></i><i class="glare"></i><i class="sparkle"></i>
      </div>

      <div class="face back">
        <img src="./back-mega-marshall.png?v=3" alt="Mega Marshall — The Bishop Rhino card">
        <i class="foil"></i><i class="glare"></i><i class="sparkle"></i>
      </div>
    </div>
  </div>

  <div class="hint">Drag to tilt • Tap to flip</div>
  <div class="badge">Bishop CISD • Digital Collectible</div>
</div>

<script>
const scene = document.getElementById('scene');
const card = document.getElementById('card');
const root = document.documentElement;

let down = false;
let moved = false;
let sx = 0;
let sy = 0;

function tilt(x,y){
  const r = scene.getBoundingClientRect();
  const px = Math.max(0,Math.min(1,(x-r.left)/r.width));
  const py = Math.max(0,Math.min(1,(y-r.top)/r.height));

  root.style.setProperty('--mx',(px*100)+'%');
  root.style.setProperty('--my',(py*100)+'%');
  root.style.setProperty('--rx',((.5-py)*18)+'deg');
  root.style.setProperty('--ry',((px-.5)*18)+'deg');
}

function resetTilt(){
  root.style.setProperty('--rx','0deg');
  root.style.setProperty('--ry','0deg');
}

scene.addEventListener('pointerdown',e=>{
  down=true;
  moved=false;
  sx=e.clientX;
  sy=e.clientY;
  try{ scene.setPointerCapture(e.pointerId); }catch(err){}
});

scene.addEventListener('pointermove',e=>{
  if(!down) return;
  if(Math.hypot(e.clientX-sx,e.clientY-sy)>7) moved=true;
  tilt(e.clientX,e.clientY);
});

scene.addEventListener('pointerup',e=>{
  down=false;
  if(!moved) card.classList.toggle('flipped');
  resetTilt();
  try{ scene.releasePointerCapture(e.pointerId); }catch(err){}
});

scene.addEventListener('pointercancel',()=>{
  down=false;
  resetTilt();
});

scene.addEventListener('pointerleave',e=>{
  if(e.pointerType==='mouse' && !down) resetTilt();
});
</script>
</body>
</html>
