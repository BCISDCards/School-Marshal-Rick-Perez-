<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131c">
<title>School Marshal Perez — Year One Card</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07131c;color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center}
main{width:min(520px,94vw);margin:auto;padding:24px 0 42px}
h1{font-size:1.45rem;margin:0 0 5px}.sub{opacity:.7;margin-bottom:20px}
.card{position:relative;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 16px 45px #000a;margin:0 auto 18px;transition:transform .12s ease}
.card img{width:100%;height:auto;display:block}
.holo:after{content:"";position:absolute;inset:-55%;pointer-events:none;
background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.5) 45%,rgba(0,255,255,.28) 50%,rgba(255,0,255,.25) 55%,transparent 66%);
mix-blend-mode:screen;animation:shine 3s linear infinite}
@keyframes shine{from{transform:translateX(-45%) rotate(8deg)}to{transform:translateX(45%) rotate(8deg)}}
button,a.save{display:block;width:100%;border:0;border-radius:12px;padding:15px;margin:10px 0;font-size:1rem;font-weight:700;text-decoration:none;cursor:pointer}
button{background:#fff;color:#07131c}.save{background:#2d9b58;color:white}
#regular{display:none}.hint{font-size:.86rem;opacity:.68;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>School Marshal Perez</h1>
<div class="sub">Year One Collectible Card</div>

<div id="hologram">
 <div class="card holo" id="tilt">
  <img src="year-one-school-marshal-bettis-front.jpg" alt="Mega Marshallon hologram card">
 </div>
 <button onclick="showRegular()">View Collectible Card</button>
</div>

<div id="regular">
 <div class="card">
  <img src="year-one-school-marshal-bettis-back.jpg" alt="School Marshal Bettis collectible card">
 </div>
 <a class="save" href="year-one-school-marshal-bettis-back.jpg" download="School-Marshal-Bettis-Year-One.jpg">Save Card to Phone</a>
 <button onclick="showHolo()">Back to Hologram Card</button>
 <div class="hint">On iPhone, if the image opens instead of downloading, press and hold it and choose Save to Photos.</div>
</div>
</main>
<script>
function showRegular(){document.getElementById('hologram').style.display='none';document.getElementById('regular').style.display='block'}
function showHolo(){document.getElementById('regular').style.display='none';document.getElementById('hologram').style.display='block'}
const c=document.getElementById('tilt');
c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(900px) rotateY(${x*12}deg) rotateX(${-y*12}deg) scale(1.015)`});
c.addEventListener('pointerleave',()=>c.style.transform='');
</script>
</body>
</html>
