<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Marshal Perez — Year One Collection</title>
<style>
*{box-sizing:border-box}
body{
 margin:0; min-height:100vh; background:#07131c; color:#fff;
 font-family:Arial,Helvetica,sans-serif;
}
header{text-align:center;padding:26px 16px 10px}
h1{margin:0;font-size:clamp(1.35rem,4vw,2rem)}
.sub{opacity:.75;margin-top:8px}
.collection{
 width:min(1100px,94vw); margin:20px auto 40px;
 display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px;
 align-items:start;
}
.item{text-align:center}
.card{
 position:relative; overflow:hidden; border-radius:16px;
 background:#000; box-shadow:0 16px 45px #0009;
 transform-style:preserve-3d;
 transition:transform .15s ease, box-shadow .15s ease;
}
.card img{display:block;width:100%;height:auto}
.card.holo:before{
 content:""; position:absolute; inset:-50%;
 background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,rgba(0,255,255,.25) 50%,rgba(255,0,255,.22) 55%,transparent 70%);
 transform:translateX(-45%) rotate(8deg);
 animation:shine 3.2s linear infinite;
 pointer-events:none; mix-blend-mode:screen;
}
@keyframes shine{
 0%{transform:translateX(-45%) rotate(8deg)}
 100%{transform:translateX(45%) rotate(8deg)}
}
.label{margin-top:12px;font-weight:700}
.small{font-size:.86rem;opacity:.68;margin-top:4px}
@media(max-width:700px){
 .collection{grid-template-columns:1fr;max-width:440px}
}
</style>
</head>
<body>
<header>
 <h1>School Marshal Bettis — Year One</h1>
 <div class="sub">Year One Card Collection</div>
</header>

<main class="collection">
 <section class="item">
   <div class="card holo" data-tilt>
     <img src="year-one-school-marshal-bettis-front.jpg" alt="Year One Mega Marshallon hologram card">
   </div>
   <div class="label">Mega Marshallon</div>
   <div class="small">Year One</div>
 </section>

 <section class="item">
   <div class="card" data-tilt>
     <img src="year-one-school-marshal-bettis-back.jpg" alt="Year One School Marshal Bettis portrait card">
   </div>
   <div class="label">School Marshal Bettis</div>
   <div class="small">Year One</div>
 </section>
</main>

<script>
document.querySelectorAll('[data-tilt]').forEach(card=>{
  card.addEventListener('pointermove',e=>{
    const r=card.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5;
    const y=(e.clientY-r.top)/r.height-.5;
    card.style.transform=`perspective(900px) rotateY(${x*10}deg) rotateX(${-y*10}deg) scale(1.015)`;
  });
  card.addEventListener('pointerleave',()=>card.style.transform='');
});
</script>
</body>
</html>
